<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">    
    <title>HYE02 PORTFOLIO</title>
    <link href="https://fonts.googleapis.com/css?family=Red+Hat+Display:400,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    

    <style>
        html, body {
        width:100%;
        height:100%;
        background:#000;
        position:relative;
        overflow:hidden;
        }

        .container {
        font-size:50px;
        font-family: 'Red Hat Display', sans-serif;
        letter-spacing:1.5px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 800px;
        height:50px;
        }

        .container > * {
        display:inline-block;
        overflow:hidden;
        position:absolute;
        }

        .ch {
        display:inline-block;
        position:relative;
        overflow:visible;
        }

        .bar {
        width:3px;
        height:50px;
        position:absolute;
        top:5px;
        }
        .txt2 {
        font-weight: 700;
        }

    </style>
</head>
<body>


  <div class="container">
  <span class="txt1">HYE02 </span><span class="txt2"></span><div class="bar"></div>
</div>

<script>
    var color2 = '#b8ff65',
    color1 = '#fff',
    moveBar = ()=>{ gsap.set('.bar', {left:gsap.getProperty('.txt1','width') + 1}) };

    // " PORTFOLIO" 글자를 span으로 분리
    var word = 'DESIGN PORTFOLIO';
    var txt2El = document.querySelector('.txt2');
    txt2El.innerHTML = word.split('').map(function(ch) {
        return '<span class="ch">' + (ch === ' ' ? '&nbsp;' : ch) + '</span>';
    }).join('');
    var t2 = txt2El.querySelectorAll('.ch');

gsap.timeline({
    delay:0.2,
    onComplete: function () {
        window.location.href = 'main.html';
    }
})
    .set('.txt1',   {color:color1, fontWeight:'regular'})
    .set('.txt2',   {color:color2, fontWeight:'bold', opacity:0, x:gsap.getProperty('.txt1','width')-2, immediateRender:true})
    .set('.bar',    {left:1, backgroundColor:color1, immediateRender:true})

    .to('.bar',     {duration:0.1, opacity:0, ease:"expo.in", yoyo:true, repeat:5, repeatDelay:0.3}, 0)
    .from('.txt1',  {duration:1.1, width:0, ease:"steps(14)", onUpdate:moveBar}, 2.5)
    .to('.bar',     {duration:0.05, backgroundColor:color2}, '+=0.15')
    .to('.bar',     {duration:1.0, width:()=>gsap.getProperty('.txt2','width'), ease:"power4.inOut"}, '+=0.1')
    .from('.container',     {duration:1.0, x:135, ease:"power4.inOut"}, '-=1.0')
    .to('.txt2',    {duration:0.01, opacity:1}, '-=0.1')
    .to('.bar',     {duration:0.4, x:()=>gsap.getProperty('.txt2','width'), width:0, ease:"power4.in"})
    .from(t2,       {duration:0.6, opacity:0, ease:"power3.inOut", stagger:0.02}, '-=0.5')
    .to('.txt1',    {duration:1.5, opacity:0.25, ease:"power3.inOut"}, '-=1.2')
    .to('.container', {duration:1.2, scale:14, y:-80, opacity:0, ease:"power2.inOut"}, '+=1')
    .timeScale(1.45)
</script>
    
</body>
</html>
